<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>

<body>

<h1>Book List</h1>

<p th:if="${message != null}"
   th:text="${message}">
</p>

<a th:href="@{/books/new}">Add New Book</a>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
        <th>Genre</th>
        <th>Available</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.year}"></td>
        <td th:text="${book.genre}"></td>
        <td th:text="${book.available ? 'Yes' : 'No'}"></td>
    </tr>

    <tr th:if="${#lists.isEmpty(books)}">
        <td colspan="6">No books added yet.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
